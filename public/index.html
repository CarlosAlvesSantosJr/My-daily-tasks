<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191a17">
  <meta name="color-scheme" content="dark">
  <title>Minhas Tarefas</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tarefas">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="login-card">
      <img src="/icon.svg" alt="" width="52" height="52">
      <h1>Minhas Tarefas</h1>
      <p class="muted">Entre para ver a sua lista.</p>

      <label for="username">Usuário</label>
      <input id="username" name="username" autocomplete="username"
             autocapitalize="none" autocorrect="off" spellcheck="false" required>

      <label for="password">Senha</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>

      <p id="login-error" class="error" role="alert" hidden></p>
      <button id="login-submit" class="primary" type="submit">Entrar</button>
    </form>
  </section>

  <div id="app-view" class="app" hidden>
    <header class="top">
      <div class="top-row">
        <div>
          <p id="today" class="muted date"></p>
          <h1>Olá, <span id="user-name"></span></h1>
        </div>
        <button id="logout" class="ghost" type="button">Sair</button>
      </div>
      <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
      <p id="summary" class="muted summary" aria-live="polite"></p>
    </header>

    <nav class="views" aria-label="Escolher visualização">
      <button type="button" data-view="list" aria-pressed="true">Lista</button>
      <button type="button" data-view="calendar" aria-pressed="false">Calendário</button>
      <button type="button" data-view="market" aria-pressed="false">
        Mercado <span id="market-badge" class="badge" hidden></span>
      </button>
    </nav>

    <main class="content">
      <section id="list-view">
        <nav class="filters" aria-label="Filtrar tarefas">
          <button type="button" data-filter="all" aria-pressed="true">Todas</button>
          <button type="button" data-filter="pending" aria-pressed="false">Pendentes</button>
          <button type="button" data-filter="done" aria-pressed="false">Concluídas</button>
        </nav>
        <ul id="todo-list" class="todo-list"></ul>
        <p id="empty" class="empty muted" hidden></p>
        <button id="clear-done" class="link" type="button" hidden>Apagar concluídas</button>
      </section>

      <section id="calendar-view" hidden>
        <div class="month-bar">
          <button id="prev-month" class="icon" type="button" aria-label="Mês anterior">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <h2 id="month-label" aria-live="polite"></h2>
          <button id="next-month" class="icon" type="button" aria-label="Próximo mês">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="go-today" class="ghost" type="button">Hoje</button>
        </div>

        <div class="weekdays" aria-hidden="true">
          <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>

        <h3 id="day-title" class="day-title"></h3>
        <ul id="day-list" class="todo-list"></ul>
        <p id="day-empty" class="empty muted" hidden>Nenhuma tarefa neste dia.</p>
      </section>

      <section id="market-view" hidden>
        <div class="market-bar">
          <span id="live-status" class="live" role="status"></span>
          <button id="install-app" class="ghost" type="button" hidden>Instalar app</button>
          <button id="enable-push" class="ghost" type="button" hidden>Ativar avisos</button>
        </div>
        <p id="push-hint" class="hint muted" hidden></p>
        <ul id="market-list" class="todo-list"></ul>
        <p id="market-empty" class="empty muted" hidden>A lista de mercado está vazia.</p>
        <button id="clear-bought" class="link" type="button" hidden>Apagar comprados</button>
      </section>
    </main>

    <div class="dock">
      <form id="add-form" class="composer">
        <p id="composer-date" class="composer-date" hidden>
          <span id="composer-date-text"></span>
          <button id="clear-date" type="button" aria-label="Remover data">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </button>
        </p>
        <div class="composer-row">
          <input id="new-todo" maxlength="500" placeholder="Nova tarefa…"
                 aria-label="Nova tarefa" autocomplete="off" enterkeyhint="done">
          <label id="date-pick" class="date-pick">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zM4 10.5h16M8.5 3.5v4M15.5 3.5v4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input id="new-date" type="date" aria-label="Escolher data da tarefa">
          </label>
          <button class="primary add" type="submit" aria-label="Adicionar tarefa">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </form>

      <footer id="weather" class="weather" hidden>
        <span id="weather-icon" class="weather-icon" aria-hidden="true"></span>
        <span id="weather-text" class="weather-text"></span>
        <button id="weather-place" class="weather-place" type="button"
                title="Usar a localização do aparelho">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z M12 12.2a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          <span id="weather-place-name"></span>
        </button>
      </footer>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <template id="todo-template">
    <li class="todo">
      <label class="check">
        <input type="checkbox">
        <span class="box" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </label>
      <div class="todo-body">
        <span class="text"></span>
        <span class="due" hidden></span>
      </div>
      <button class="icon edit" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3zM14 8l3 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="icon delete" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </li>
  </template>

  <template id="market-template">
    <li class="todo">
      <label class="check">
        <input type="checkbox">
        <span class="box" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </label>
      <div class="todo-body">
        <span class="text"></span>
        <span class="due"></span>
      </div>
      <button class="icon delete" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </li>
  </template>

  <template id="edit-template">
    <li class="todo editing">
      <form class="edit-form">
        <input class="edit-input" maxlength="500" aria-label="Editar tarefa"
               autocomplete="off" enterkeyhint="done" required>
        <div class="edit-row">
          <input class="edit-date" type="date" aria-label="Data da tarefa">
          <button class="ghost cancel" type="button">Cancelar</button>
          <button class="primary save" type="submit">Salvar</button>
        </div>
      </form>
    </li>
  </template>
</body>
</html>
