apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-dados
  namespace: todo-list
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
  namespace: todo-list
  labels:
    app: todo
spec:
  # Os dados ficam em arquivos e o tempo real roda em memória: precisa ser uma
  # réplica só, e a antiga tem de parar antes de a nova abrir o volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: todo
          image: to-do-list:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: USERS_FILE
              value: /etc/todo/users.json
            # Seguro porque o Service é interno: só o túnel chega até aqui.
            - name: TRUST_PROXY
              value: cloudflare
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: dados
              mountPath: /data
            - name: usuarios
              mountPath: /etc/todo
              readOnly: true
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: todo-dados
        - name: usuarios
          secret:
            secretName: todo-usuarios
---
apiVersion: v1
kind: Service
metadata:
  name: todo
  namespace: todo-list
spec:
  type: ClusterIP
  selector:
    app: todo
  ports:
    - port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: todo-list
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.4.0
          imagePullPolicy: IfNotPresent
          # Túnel rápido: não precisa de conta, mas o endereço muda a cada
          # reinício deste pod.
          args:
            - tunnel
            - --no-autoupdate
            - --url
            - http://todo.todo-list.svc.cluster.local:80
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
